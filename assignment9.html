  <body>
    <h3>Quotation and Citation</h3>

    <p>Short quotation:</p>

    <p>
      <q>Practice makes a person perfect.</q>
    </p>

    <p>Block quotation:</p>

    <blockquote>
      Learning HTML is the first step towards web development.
    </blockquote>

    <p>
      Book name:
      <cite>HTML and CSS for Beginners</cite>
    </p>

    <p>
      <abbr title="World Wide Web Consortium"> W3C </abbr>
      defines web standards.
    </p>

    <p><dfn>HTML</dfn> stands for HyperText Markup Language.</p>
  </body>
</html>
